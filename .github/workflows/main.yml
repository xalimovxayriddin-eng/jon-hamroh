name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8' # Flet aynan shu versiyani talab qildi
          channel: 'stable'

      - name: Install Python and Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet edge-tts google-genai pytest

      - name: Configure Flutter and Build
        run: |
          flutter config --no-analytics
          flet build apk
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jon-hamroh-app
          path: build/apk/*.apk
