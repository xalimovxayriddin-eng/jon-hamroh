name: Build Flet APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Python and Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet edge-tts google-genai pytest

      - name: Build Android APK
        run: |
          export PATH="$PATH:$FLUTTER_ROOT/bin"
          flet build apk --no-interactive
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jon-hamroh-app
          path: build/apk/*.apk
